[project]
name = "recsys"
version = "0.1.0"
description = "Content-based / sequential recommender system: ingestion, training, evaluation, serving."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "safetensors>=0.4"]
serving = ["fastapi>=0.115", "uvicorn>=0.30", "faiss-cpu>=1.8"]
mlx = ["mlx>=0.18; sys_platform == 'darwin' and platform_machine == 'arm64'"]
gcp = ["google-cloud-bigquery>=3.25", "google-cloud-storage>=2.18", "google-cloud-aiplatform>=1.60"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pandas-stubs",
]

[project.scripts]
recsys = "recsys.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end / slow tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/recsys"]

[tool.importlinter]
root_package = "recsys"

[[tool.importlinter.contracts]]
name = "core depends on nothing else in recsys"
type = "forbidden"
source_modules = ["recsys.core"]
forbidden_modules = ["recsys.ingestion", "recsys.cli"]

[[tool.importlinter.contracts]]
name = "ingestion does not depend on the CLI"
type = "forbidden"
source_modules = ["recsys.ingestion"]
forbidden_modules = ["recsys.cli"]

[[tool.importlinter.contracts]]
name = "evaluation does not depend on ingestion or the CLI"
type = "forbidden"
source_modules = ["recsys.evaluation"]
forbidden_modules = ["recsys.ingestion", "recsys.cli"]
